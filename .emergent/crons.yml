crons:
  - name: nfl-daily-refresh
    description: "Retrains the NFL Q1/1H model and refreshes sportsbook odds every morning at 7am ET"
    cron: "0 7 * * *"
    timezone: "America/New_York"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/nfl-refresh"
    method: POST
    enabled: true
